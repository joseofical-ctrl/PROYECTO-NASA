<style>

html,body{height:100%;margin:0;background:#05060c;font-family:"Press Start 2P",ui-monospace,monospace;color:#fff}
body{display:flex;align-items:center;justify-content:center}

#s.end{background:none;justify-content:flex-end;padding-bottom:12%;pointer-events:none}
#s h1{margin:0;font-size:calc(var(--u)*.05);color:#ffb347;text-shadow:calc(var(--u)*.005) calc(var(--u)*.005) 0 #7a2c10;text-align:center;line-height:1.3}
#s.end h1{display:none}
button{font:inherit;font-size:calc(var(--u)*.022);background:#ffb347;color:#2a1405;border:0;padding:1.4% 3%;cursor:pointer;box-shadow:calc(var(--u)*.005) calc(var(--u)*.005) 0 #000;pointer-events:auto}

</head>

 y.save();y.translate(px,py);y.scale(1.3,1.3);
 R(-3.5+L,-7,3,7,'#e9edf2');R(.5-L,-7,3,7,'#cfd5dd');R(-3.5+L,-4,3,.5,'#aab3bf');R(.5-L,-4,3,.5,'#aab3bf');R(-4+L,-1.8,4,1.8,'#3a3f48');R(-L,-1.8,4,1.8,'#3a3f48');

  for(const[a0,b0]of[[-.6,-.3],[0,.3]]){const a=Math.max(-hw,Wc*a0),b=Math.min(hw,Wc*b0);if(b>a)r(cx+a,top+j,b-a,1,c2)}}
 r(cx-Wc,top+Hc-1,2*Wc,1,'#8f3a0f')}

 for(let i=0;i<17;i++){const hw=3+Math.floor(i*.55);r(cx-hw,ty+i,2*hw,1,i>=13?'#3a322d':'#8f9399');r(cx-hw,ty+i,2,1,'#6c7075');r(cx+hw-2,ty+i,2,1,'#b8bdc4');

 r(sx+68,45,1,20,'#aaa');r(sx+64,45,8,1,'#ccc');r(sx+72,45,6,3,'#c33');r(sx+72,48,6,1,'#fff');

 x.font='6px "Press Start 2P",monospace';x.textAlign='left';x.fillStyle='#2a4aa0';x.fillText('NASA',sx+8,90);

function ast(i,px,py,ph,wv){const L=Math.round(Math.sin(ph)*2),c='rgb('+RIM[i]+')';
 r(px-3+L,py-6,3,6,'#e9edf2');r(px-L,py-6,3,6,'#d5dae1');r(px-3+L,py-2,4,2,'#555');r(px-L,py-2,4,2,'#555');

function frame(now){
 const d=D=t0==null?0:(now-t0)/1000;
 y.setTransform(1,0,0,1,0,0);y.clearRect(0,0,960,540);y.setTransform(4,0,0,4,0,0);

 // paracaídas: líneas + cápsula + velas

 else if(d>=8.5&&d<17){const s=ease((d-8.5)/1.3),o=Math.max(0,d-15);ch=[-24,0,24].map(dx=>[cx+dx*s+o*14,ty-36+o*8,14*s,12*s,'#e8532a','#fff'])}

 if(d>=31.5&&d<34.5)say2('WELL DONE!',sx+70,60);
 if(d>=34.5&&d<38)say2('MISSION ACCOMPLISHED!',sx+40,48);
 if(d>=31){const t=d-31;for(let n=0;n<60;n++){const yy=((n*29)%40-10)+t*(14+(n*13)%20),xx=(n*47)%W+Math.sin(t*2+n)*4;if(yy<H&&yy>-4)r(xx,yy,2,2,CONF[n%5])}}
 // effects
 if(hot>0){x.globalAlpha=.12*hot;r(0,0,W,H,'#ff7a22');x.globalAlpha=1}
 if(t0!=null&&!f1&&d>=8.5){f1=1;flash=.7}
 if(t0!=null&&!f2&&d>=15){f2=1;flash=.5}
 if(t0!=null&&!f3&&d>=31){f3=1;flash=.4}
 if(d<.7){x.globalAlpha=1-d/.7;r(0,0,W,H,'#000');x.globalAlpha=1}
 if(flash>.01){x.globalAlpha=flash;r(0,0,W,H,'#fff');x.globalAlpha=1;flash*=.93}
 // HUD labels
 let big='',sub='',col='#fff',alt='',vel='';
 const am=d<15?Math.round(120000*Math.pow(1-d/15,3)):0;
 alt='ALT '+(am>=10000?Math.round(am/1000)+' km':am+' m');
 vel='VEL '+(d<6?Math.round(8000-d/6*7000):d<8.5?Math.round(lerp(1000,100,(d-6)/2.5)):d<15?Math.round(lerp(100,8,(d-8.5)/6.5)):0)+' m/s';
 if(d<3){big='RE-ENTRY';sub='HEAT SHIELD ACTIVE';col='#ff9a4a'}
 else if(d<6){big='RE-ENTRY';sub='COMMS BLACKOUT';col='#ff6a2a'}
 else if(d<8.5){big='PARACHUTES';sub='DROGUES DEPLOYED';col='#ffb347'}
 else if(d<11){big='PARACHUTES';sub='MAIN CHUTES OPEN';col='#ffd966'}
 else if(d<15){big='FINAL DESCENT';sub='SPLASHDOWN IN SECONDS';col='#8fdcff'}
 else if(d<17){big='SPLASHDOWN!';sub='PACIFIC OCEAN';col='#ffd966'}
 else if(d<20){big='FLOTATION';sub='STABILITY BAGS INFLATED';col='#ffb347'}
 else if(d<23){big='RECOVERY';sub='NASA VESSEL IN POSITION';col='#8fdcff'}
 else if(d<31){big='HATCH OPEN';col='#8fdcff';const i=Math.min(3,Math.floor((d-23)/1.3));alt='CREW MEMBER '+(i+1)+': '+NAMES[i];vel=''}
 else if(d<35){big='CONGRATULATIONS!';sub='NASA WELCOMES YOU HOME';col='#ffd966';vel=''}
 else{big='WELCOME HOME';sub='EAGLE MISSION ACCOMPLISHED';col='#8fdcff';vel=''}
 if(d>=15&&d<23)vel='';
 const B=$('big');B.textContent=big;B.style.color=col;$('sub').textContent=sub;
 $('ck').textContent='T+00:'+String(Math.floor(d)).padStart(2,'0');$('alt').textContent=alt;$('vel').textContent=vel;
 if(d>=38&&!ended){ended=1;const sk=$('skipBtn');if(sk)sk.style.display='none';notifyReturnHomeFinished(false)}
 requestAnimationFrame(frame)}

function sound(){try{if(ac)ac.close();ac=new(window.AudioContext||window.webkitAudioContext)();const T=ac.currentTime;
 const nz=(a,du,fr,v,ty)=>{const n=Math.floor(ac.sampleRate*du),bf=ac.createBuffer(1,n,ac.sampleRate),dd=bf.getChannelData(0);for(let i=0;i<n;i++)dd[i]=Math.random()*2-1;
  const s=ac.createBufferSource();s.buffer=bf;const f=ac.createBiquadFilter();f.type=ty||'lowpass';f.frequency.value=fr;const g=ac.createGain();
  g.gain.setValueAtTime(v,T+a);g.gain.linearRampToValueAtTime(0,T+a+du);s.connect(f);f.connect(g);g.connect(ac.destination);s.start(T+a)};
 const tn=(a,fr,du,ty,v)=>{const o=ac.createOscillator(),og=ac.createGain();o.type=ty;o.frequency.value=fr;og.gain.setValueAtTime(v,T+a);og.gain.exponentialRampToValueAtTime(.001,T+a+du);o.connect(og);og.connect(ac.destination);o.start(T+a);o.stop(T+a+du)};
 nz(0,7,900,.2);nz(6,9,2200,.04,'bandpass');
 tn(6,100,.3,'square',.15);tn(8.5,70,.5,'square',.25);tn(8.65,45,.6,'sawtooth',.2);
 nz(15,1.6,1800,.3);tn(15,60,.8,'sawtooth',.2);tn(20,110,1.2,'sawtooth',.08);
 [523,659,784,1047,784,1047].forEach((f,i)=>tn(31+i*.22,f,.25,'square',.1))}catch(e){}}
let finishedPosted=0;
function stopReturnAudio(){try{if(ac&&ac.state!=='closed')ac.close()}catch(e){}}
function notifyReturnHomeFinished(skipped){
  if(finishedPosted)return;
  finishedPosted=1;
  if(skipped)stopReturnAudio();
  try{window.parent.postMessage({type:'RETURN_HOME_FINISHED',skipped:Boolean(skipped)},'*')}catch(e){}
}
function startReturnHome(){
  t0=performance.now();f1=f2=f3=0;flash=0;ended=0;finishedPosted=0;
  const s=$('s');s.style.display='none';s.className='';
  const sk=$('skipBtn');if(sk)sk.style.display='block';
  sound();
  if(ac&&ac.state==='suspended')ac.resume().catch(()=>{});
}
$('skipBtn').onclick=()=>{ended=1;notifyReturnHomeFinished(true)};
$('b').onclick=startReturnHome;
const unlockReturnAudio=()=>{try{if(ac&&ac.state==='suspended')ac.resume().catch(()=>{})}catch(e){}};
window.addEventListener('pointerdown',unlockReturnAudio,{once:true});
window.addEventListener('keydown',unlockReturnAudio,{once:true});
startReturnHome();
requestAnimationFrame(frame);
</script>
