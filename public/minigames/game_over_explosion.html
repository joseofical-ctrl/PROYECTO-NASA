<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GAME OVER · 32x32 Orbital Collision</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #02040a;
        font-family: 'Press Start 2P', 'Courier New', monospace;
        color: #f8fafc;
      }
      #scene {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      .scanlines {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 10;
        background: repeating-linear-gradient(
          0deg,
          rgba(0, 0, 0, 0.24) 0px,
          rgba(0, 0, 0, 0.24) 1px,
          transparent 1px,
          transparent 3px
        );
      }
      #hud-alert {
        position: fixed;
        top: 18px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 20;
        padding: 10px 18px;
        border: 3px solid #f59e0b;
        background: rgba(15, 6, 8, 0.9);
        color: #fde047;
        font-size: clamp(10px, 1.5vw, 15px);
        letter-spacing: 1px;
        text-align: center;
        text-shadow: 2px 2px 0 #000;
        box-shadow: 0 0 24px rgba(245, 158, 11, 0.45);
        white-space: nowrap;
      }
      #hud-alert.imminent {
        border-color: #ff2e4c;
        background: rgba(48, 4, 12, 0.94);
        color: #ff8fa3;
        box-shadow: 0 0 32px rgba(255, 46, 76, 0.75);
        animation: hudFlash 0.28s steps(2, end) infinite;
      }
      #hud-telemetry {
        position: fixed;
        bottom: 14px;
        left: 16px;
        right: 16px;
        z-index: 20;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        font-size: clamp(8px, 1vw, 10px);
        color: #94a3b8;
        text-shadow: 2px 2px 0 #000;
        pointer-events: none;
      }
      @keyframes hudFlash {
        0% {
          opacity: 1;
          transform: translateX(-50%) scale(1.02);
        }
        100% {
          opacity: 0.72;
          transform: translateX(-50%) scale(1);
        }
      }
      @keyframes neonRedPulse {
        0%,
        100% {
          color: #ff3b5c;
          text-shadow:
            0 0 10px #ff1e42,
            0 0 24px #e11d48,
            3px 3px 0 #000;
        }
        50% {
          color: #ffe4e6;
          text-shadow:
            0 0 16px #ff4d6d,
            0 0 38px #ff0033,
            3px 3px 0 #000;
        }
      }
      #end-overlay {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: radial-gradient(circle at center, rgba(58, 7, 16, 0.78) 0%, rgba(3, 5, 12, 0.94) 100%);
        backdrop-filter: blur(3px);
      }
      #end-overlay.visible {
        display: flex;
      }
      .end-card {
        width: 100%;
        max-width: 720px;
        background: linear-gradient(180deg, #16070d 0%, #09060e 100%);
        border: 4px solid #ff3b5c;
        box-shadow:
          0 0 0 4px #000,
          0 0 48px rgba(255, 46, 76, 0.55);
        padding: clamp(20px, 3vw, 34px);
        text-align: center;
      }
      .end-title {
        font-size: clamp(20px, 3.6vw, 34px);
        line-height: 1.3;
        animation: neonRedPulse 0.75s ease-in-out infinite;
        margin-bottom: 14px;
      }
      .end-subtitle {
        font-size: clamp(10px, 1.5vw, 14px);
        color: #fca5a5;
        line-height: 1.6;
        letter-spacing: 0.8px;
        text-shadow: 2px 2px 0 #000;
        margin-bottom: 18px;
      }
      .end-cause-box {
        background: rgba(8, 10, 20, 0.92);
        border: 2px solid #7f1d1d;
        padding: 12px 14px;
        margin-bottom: 22px;
        text-align: left;
      }
      .end-cause-label {
        font-size: 9px;
        color: #f59e0b;
        margin-bottom: 6px;
      }
      .end-cause-text {
        font-size: clamp(9px, 1.2vw, 11px);
        line-height: 1.65;
        color: #f1f5f9;
      }
      .end-mission-tag {
        margin-top: 8px;
        font-size: 8px;
        color: #94a3b8;
      }
      .end-actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 14px;
      }
      .px-btn {
        font-family: 'Press Start 2P', 'Courier New', monospace;
        font-size: clamp(9px, 1.2vw, 11px);
        line-height: 1.5;
        padding: 13px 18px;
        cursor: pointer;
        border: 3px solid #000;
        color: #fff;
        text-shadow: 2px 2px 0 #000;
        transition: transform 0.1s ease, filter 0.15s ease;
      }
      .px-btn:hover {
        filter: brightness(1.18);
        transform: translateY(-2px);
      }
      .px-btn:active {
        transform: translateY(1px);
      }
      .btn-retry {
        background: linear-gradient(180deg, #dc2626 0%, #991b1b 100%);
        box-shadow:
          inset 0 2px 0 #fca5a5,
          0 0 18px rgba(239, 68, 68, 0.45);
      }
      .btn-menu {
        background: linear-gradient(180deg, #334155 0%, #1e293b 100%);
        box-shadow: inset 0 2px 0 #94a3b8;
      }
    </style>
  </head>
  <body>
    <canvas id="scene" width="320" height="180"></canvas>
    <div class="scanlines"></div>

    <div id="hud-alert">⚠ CONTROL FAILURE ⚠</div>
    <div id="hud-telemetry">
      <span id="hud-left">ORBITER TELEMETRY · CRITICAL INTEGRITY</span>
      <span id="hud-right">RELATIVE DISTANCE: 142 M</span>
    </div>

    <div id="end-overlay" role="dialog" aria-modal="true" aria-label="GAME OVER">
      <div class="end-card">
        <div class="end-title">💥 GAME OVER 💥</div>
        <div class="end-subtitle">TOTAL CONTROL FAILURE · ORBITAL LOSS</div>

        <div class="end-cause-box">
          <div class="end-cause-label">📋 OFFICIAL ORBITAL COLLAPSE REPORT:</div>
          <div class="end-cause-text" id="end-reason-text">
            Catastrophic loss of structural integrity and station attitude control.
          </div>
          <div class="end-mission-tag" id="end-mission-tag"></div>
        </div>

        <div class="end-actions">
          <button type="button" class="px-btn btn-retry" id="btn-retry">
            [ ↻ RETRY MISSION ]
          </button>
          <button type="button" class="px-btn btn-menu" id="btn-menu">
            [ ⌂ MAIN MENU ]
          </button>
        </div>
      </div>
    </div>

    <script>
      (function () {
        var qs = new URLSearchParams(window.location.search || '');
        var reasonText =
          qs.get('reason') ||
          'Critical Space Station collapse: hull integrity dropped to 0%.';
        var missionText = qs.get('mission') || '';

        var reasonEl = document.getElementById('end-reason-text');
        if (reasonEl) reasonEl.textContent = reasonText;
        var missionEl = document.getElementById('end-mission-tag');
        if (missionEl) {
          missionEl.textContent = missionText ? 'AFFECTED STAGE: ' + missionText : '';
        }

        // Matrices exactas 32x32 de dos CubeSats en colisión orbital
        var CUBESAT1_32X32 = [
          '................................',
          '...............CC...............',
          '...............MM...............',
          '...............MM...............',
          '..BBBBBB.......WW.......BBBBBB..',
          '.BCCCCCCB......WW......BCCCCCCB.',
          '.BCCCCCCB..GGGGGGGGGG..BCCCCCCB.',
          '.BBBBBBBB..GOOOOOOOOG..BBBBBBBB.',
          '.BCCCCCCB..GOMMMMMMOG..BCCCCCCB.',
          '.BCCCCCCB..GOMCCCCMOG..BCCCCCCB.',
          '.BBBBBBBBWWGOMCKKCMOGWWBBBBBBBB.',
          '.BCCCCCCBWWGOMCKKCMOGWWBCCCCCCB.',
          '.BCCCCCCB..GOMCCCCMOG..BCCCCCCB.',
          '.BBBBBBBB..GOMMMMMMOG..BBBBBBBB.',
          '.BCCCCCCB..GOOOOOOOOG..BCCCCCCB.',
          '.BCCCCCCB..GGGGGGGGGG..BCCCCCCB.',
          '.BBBBBBBB....MMMMMM....BBBBBBBB.',
          '.BCCCCCCB....MWWWWM....BCCCCCCB.',
          '.BCCCCCCB....MRWWWM....BCCCCCCB.',
          '..BBBBBB.....MMMMMM.....BBBBBB..',
          '............WW....WW............',
          '...........WC......CW...........',
          '...........WW......WW...........',
          '............R......R............',
          '................................',
          '................................',
          '................................',
          '................................',
          '................................',
          '................................',
          '................................',
          '................................',
        ];

        var CUBESAT2_32X32 = [
          '................................',
          '.............MMMMMM.............',
          '............MWWWWWWM............',
          '.............MMCCMM.............',
          '...CCCCCC......MM......CCCCCC...',
          '..CSSSSSSC..DDDDDDDD..CSSSSSSC..',
          '..CSSSSSSC..DMMMMMMD..CSSSSSSC..',
          '..CCCCCCCC..DMGGGGMD..CCCCCCCC..',
          '..CSSSSSSCWWDMGKKGMDWWCSSSSSSC..',
          '..CSSSSSSCWWDMGKKGMDWWCSSSSSSC..',
          '..CCCCCCCC..DMGGGGMD..CCCCCCCC..',
          '..CSSSSSSC..DMMMMMMD..CSSSSSSC..',
          '..CSSSSSSC..DDDDDDDD..CSSSSSSC..',
          '...CCCCCC....MMGGMM....CCCCCC...',
          '............MMOYYOMM............',
          '...........MMOOOOOOMM...........',
          '...........MDDDDDDDDM...........',
          '............RR....RR............',
          '............YY....YY............',
          '................................',
          '................................',
          '................................',
          '................................',
          '................................',
          '................................',
          '................................',
          '................................',
          '................................',
          '................................',
          '................................',
          '................................',
          '................................',
        ];

        var PALETTE = {
          B: '#1d4ed8',
          C: '#38bdf8',
          S: '#2563eb',
          G: '#eab308',
          O: '#f59e0b',
          Y: '#fde047',
          M: '#64748b',
          D: '#334155',
          W: '#e2e8f0',
          K: '#090d16',
          R: '#ef4444',
        };

        var canvas = document.getElementById('scene');
        var ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false;

        var hudAlert = document.getElementById('hud-alert');
        var hudRight = document.getElementById('hud-right');
        var endOverlay = document.getElementById('end-overlay');

        // Pre-render de sprites 32x32 en canvas offscreen
        function bakeSprite(rows) {
          var c = document.createElement('canvas');
          c.width = 32;
          c.height = 32;
          var xctx = c.getContext('2d');
          for (var y = 0; y < rows.length; y++) {
            var line = rows[y];
            for (var x = 0; x < line.length; x++) {
              var ch = line[x];
              if (ch !== '.' && PALETTE[ch]) {
                xctx.fillStyle = PALETTE[ch];
                xctx.fillRect(x, y, 1, 1);
              }
            }
          }
          return c;
        }
        var sprite1 = bakeSprite(CUBESAT1_32X32);
        var sprite2 = bakeSprite(CUBESAT2_32X32);

        // Estrellas fijas + luces de ciudad sobre el horizonte terrestre
        var stars = [];
        for (var si = 0; si < 95; si++) {
          stars.push({
            x: (si * 73 + 19) % 320,
            y: (si * 41 + 7) % 142,
            phase: si * 0.7,
            big: si % 9 === 0,
          });
        }

        // Web Audio 8-bit: alarmas + super explosión procedural
        var ac = null;
        function ensureAudio() {
          if (!ac) {
            var AC = window.AudioContext || window.webkitAudioContext;
            if (AC) ac = new AC();
          }
          if (ac && ac.state === 'suspended') {
            ac.resume().catch(function () {});
          }
        }

        function playKlaxon(freq, dur) {
          try {
            ensureAudio();
            if (!ac) return;
            var now = ac.currentTime;
            var osc = ac.createOscillator();
            var gain = ac.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(freq || 640, now);
            osc.frequency.exponentialRampToValueAtTime((freq || 640) * 0.62, now + (dur || 0.18));
            gain.gain.setValueAtTime(0.09, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + (dur || 0.18));
            osc.connect(gain);
            gain.connect(ac.destination);
            osc.start(now);
            osc.stop(now + (dur || 0.18));
          } catch (e) {}
        }

        function playSuperCollisionExplosion() {
          try {
            ensureAudio();
            if (!ac) return;
            var now = ac.currentTime;

            // 1) Ruido blanco filtrado largo de detonación espacial
            var dur = 2.1;
            var len = Math.floor(ac.sampleRate * dur);
            var buf = ac.createBuffer(1, len, ac.sampleRate);
            var data = buf.getChannelData(0);
            for (var i = 0; i < len; i++) {
              var env = Math.pow(1 - i / len, 1.45);
              data[i] = (Math.random() * 2 - 1) * env;
            }
            var src = ac.createBufferSource();
            src.buffer = buf;
            var filter = ac.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(1600, now);
            filter.frequency.exponentialRampToValueAtTime(75, now + dur);
            var ngain = ac.createGain();
            ngain.gain.setValueAtTime(0.55, now);
            ngain.gain.exponentialRampToValueAtTime(0.001, now + dur);
            src.connect(filter);
            filter.connect(ngain);
            ngain.connect(ac.destination);
            src.start(now);

            // 2) Impacto sub-grave 130Hz -> 24Hz
            var sub = ac.createOscillator();
            var sg = ac.createGain();
            sub.type = 'sawtooth';
            sub.frequency.setValueAtTime(135, now);
            sub.frequency.exponentialRampToValueAtTime(24, now + 0.9);
            sg.gain.setValueAtTime(0.45, now);
            sg.gain.exponentialRampToValueAtTime(0.001, now + 0.95);
            sub.connect(sg);
            sg.connect(ac.destination);
            sub.start(now);
            sub.stop(now + 0.96);

            // 3) Explosiones secundarias de metralla metálica
            [0.14, 0.34, 0.62].forEach(function (offset, idx) {
              var o2 = ac.createOscillator();
              var g2 = ac.createGain();
              o2.type = 'square';
              o2.frequency.setValueAtTime(320 - idx * 65, now + offset);
              o2.frequency.exponentialRampToValueAtTime(38, now + offset + 0.35);
              g2.gain.setValueAtTime(0.2, now + offset);
              g2.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.36);
              o2.connect(g2);
              g2.connect(ac.destination);
              o2.start(now + offset);
              o2.stop(now + offset + 0.37);
            });
          } catch (e) {}
        }

        window.addEventListener('pointerdown', ensureAudio, { once: true });
        window.addEventListener('keydown', ensureAudio, { once: true });

        var SHOCK_COLORS = ['#ffffff', '#38bdf8', '#fde047', '#fb923c', '#ff2e4c', '#f472b6'];
        var PARTICLE_COLORS = ['#ffffff', '#fde047', '#fb923c', '#ff2e4c', '#38bdf8', '#cbd5e1', '#94a3b8'];
        var shockwaves = [];
        var particles = [];
        var exploded = false;
        var overlayShown = false;
        var lastBeepBucket = -1;
        var flashAlpha = 0;
        var shakeAmp = 0;
        var t0 = performance.now();

        function spawnExplosion(cx, cy) {
          exploded = true;
          flashAlpha = 1;
          shakeAmp = 10;
          playSuperCollisionExplosion();

          // 6 ondas expansivas escalonadas
          for (var s = 0; s < 6; s++) {
            shockwaves.push({
              x: cx,
              y: cy,
              r: 2,
              speed: 1.3 + s * 0.45,
              maxR: 150 + s * 22,
              delay: s * 0.08,
              color: SHOCK_COLORS[s % SHOCK_COLORS.length],
              width: s === 0 ? 3 : 2,
            });
          }

          // 260 partículas de escombros y plasma
          for (var p = 0; p < 260; p++) {
            var ang = (Math.PI * 2 * p) / 260 + (Math.random() - 0.5) * 0.35;
            var spd = 0.35 + Math.random() * 4.4;
            particles.push({
              x: cx + (Math.random() - 0.5) * 8,
              y: cy + (Math.random() - 0.5) * 8,
              vx: Math.cos(ang) * spd,
              vy: Math.sin(ang) * spd,
              life: 0.9 + Math.random() * 1.4,
              maxLife: 2.3,
              size: p % 7 === 0 ? 3 : p % 3 === 0 ? 2 : 1,
              color: PARTICLE_COLORS[p % PARTICLE_COLORS.length],
            });
          }
        }

        function drawEarthHorizon(elapsed) {
          // Atmósfera y curvatura de la Tierra abajo (320x180 pixel art)
          var earthR = 390;
          var ecx = 160;
          var ecy = 532;

          // Halo azul atmosférico
          ctx.fillStyle = '#082f49';
          ctx.beginPath();
          ctx.arc(ecx, ecy, earthR + 10, Math.PI * 1.15, Math.PI * 1.85);
          ctx.fill();

          ctx.fillStyle = '#0284c7';
          ctx.beginPath();
          ctx.arc(ecx, ecy, earthR + 4, Math.PI * 1.15, Math.PI * 1.85);
          ctx.fill();

          ctx.fillStyle = '#38bdf8';
          ctx.beginPath();
          ctx.arc(ecx, ecy, earthR + 1, Math.PI * 1.15, Math.PI * 1.85);
          ctx.fill();

          // Esfera terrestre nocturna-crepuscular
          ctx.fillStyle = '#041226';
          ctx.beginPath();
          ctx.arc(ecx, ecy, earthR, Math.PI * 1.15, Math.PI * 1.85);
          ctx.fill();

          // Nubes pixeladas y luces de ciudades
          ctx.fillStyle = '#1e3a5f';
          for (var c = 0; c < 18; c++) {
            var px = ((c * 37 + Math.floor(elapsed * 2)) % 320) | 0;
            var py = 148 + ((c * 13) % 24);
            ctx.fillRect(px, py, 10 + (c % 3) * 4, 2);
          }
          ctx.fillStyle = '#fbbf24';
          for (var l = 0; l < 22; l++) {
            var lx = (l * 29 + 11) % 316;
            var ly = 152 + ((l * 17) % 25);
            ctx.fillRect(lx, ly, 1, 1);
          }
        }

        function frame(now) {
          var elapsed = (now - t0) / 1000;
          var impactTime = 3.1;

          // Sonidos de advertencia escalando hacia colisión
          if (!exploded) {
            if (elapsed < 1.6) {
              var b1 = Math.floor(elapsed / 0.55);
              if (b1 !== lastBeepBucket) {
                lastBeepBucket = b1;
                playKlaxon(520, 0.14);
              }
            } else {
              if (hudAlert && !hudAlert.classList.contains('imminent')) {
                hudAlert.textContent = '🚨 IMMINENT COLLISION 🚨';
                hudAlert.classList.add('imminent');
              }
              var b2 = Math.floor(elapsed / 0.24);
              if (b2 !== lastBeepBucket) {
                lastBeepBucket = b2;
                playKlaxon(840, 0.12);
              }
              shakeAmp = Math.max(shakeAmp, (elapsed - 1.6) * 1.5);
            }
          }

          var cx = 160;
          var cy = 84;
          var progress = Math.min(1, elapsed / impactTime);
          var ease = progress * progress;

          // Converging trajectories for CUBESAT1 and CUBESAT2
          var sat1X = Math.round(-22 + (cx - 14 - -22) * ease);
          var sat1Y = Math.round(30 + (cy - 14 - 30) * ease);
          var sat2X = Math.round(310 + (cx - 18 - 310) * ease);
          var sat2Y = Math.round(126 + (cy - 18 - 126) * ease);
          var relMeters = Math.max(0, Math.round((1 - ease) * 185));
          if (hudRight) {
            hudRight.textContent = exploded
              ? 'SIGNAL LOST · KESSLER CASCADE'
              : 'RELATIVE DISTANCE: ' + relMeters + ' M';
          }

          if (!exploded && elapsed >= impactTime) {
            spawnExplosion(cx, cy);
            if (hudAlert) {
              hudAlert.textContent = '💥 ORBITAL IMPACT • SUPER EXPLOSION 💥';
            }
          }

          if (exploded && !overlayShown && elapsed >= impactTime + 2.1) {
            overlayShown = true;
            if (endOverlay) endOverlay.classList.add('visible');
          }

          // Render pixel-art 320x180
          ctx.save();
          if (shakeAmp > 0.1) {
            var ox = (Math.random() - 0.5) * shakeAmp * 2;
            var oy = (Math.random() - 0.5) * shakeAmp * 2;
            ctx.translate(Math.round(ox), Math.round(oy));
            shakeAmp *= 0.93;
          }

          ctx.fillStyle = '#02040a';
          ctx.fillRect(-16, -16, 352, 212);

          // Estrellas
          for (var i = 0; i < stars.length; i++) {
            var st = stars[i];
            var tw = Math.sin(elapsed * 3.5 + st.phase);
            ctx.fillStyle = tw > 0.3 ? '#ffffff' : tw > -0.3 ? '#94a3b8' : '#334155';
            ctx.fillRect(st.x, st.y, st.big ? 2 : 1, st.big ? 2 : 1);
          }

          drawEarthHorizon(elapsed);

          if (!exploded) {
            // Vectores de colisión parpadeantes en rojo
            if (elapsed > 1.4 && Math.floor(elapsed * 12) % 2 === 0) {
              ctx.strokeStyle = '#ff2e4c';
              ctx.lineWidth = 1;
              ctx.setLineDash([3, 3]);
              ctx.beginPath();
              ctx.moveTo(sat1X + 16, sat1Y + 14);
              ctx.lineTo(cx, cy);
              ctx.moveTo(sat2X + 16, sat2Y + 14);
              ctx.lineTo(cx, cy);
              ctx.stroke();
              ctx.setLineDash([]);
            }

            // Dibujar ambos CubeSats 32x32
            ctx.drawImage(sprite1, sat1X, sat1Y);
            ctx.drawImage(sprite2, sat2X, sat2Y);

            // Chispas de fallo RCS
            if (Math.random() < 0.75) {
              ctx.fillStyle = Math.random() > 0.5 ? '#fb923c' : '#fde047';
              ctx.fillRect(sat1X + 4 + ((Math.random() * 20) | 0), sat1Y + 8, 2, 2);
              ctx.fillRect(sat2X + 4 + ((Math.random() * 20) | 0), sat2Y + 8, 2, 2);
            }
          } else {
            // Ondas expansivas concéntricas
            for (var si = shockwaves.length - 1; si >= 0; si--) {
              var sw = shockwaves[si];
              if (sw.delay > 0) {
                sw.delay -= 0.016;
                continue;
              }
              sw.r += sw.speed;
              var alpha = Math.max(0, 1 - sw.r / sw.maxR);
              if (alpha <= 0) {
                shockwaves.splice(si, 1);
                continue;
              }
              ctx.save();
              ctx.globalAlpha = alpha;
              ctx.strokeStyle = sw.color;
              ctx.lineWidth = sw.width;
              ctx.beginPath();
              ctx.arc(sw.x, sw.y, sw.r, 0, Math.PI * 2);
              ctx.stroke();
              ctx.restore();
            }

            // Nucleo incandescente tras impacto
            var coreAge = elapsed - impactTime;
            if (coreAge < 0.7) {
              var cr = Math.max(2, 26 * (1 - coreAge / 0.7));
              ctx.fillStyle = coreAge < 0.2 ? '#ffffff' : '#fb923c';
              ctx.beginPath();
              ctx.arc(cx, cy, cr, 0, Math.PI * 2);
              ctx.fill();
            }

            // 260 escombros incandescentes
            for (var pi = particles.length - 1; pi >= 0; pi--) {
              var pt = particles[pi];
              pt.x += pt.vx;
              pt.y += pt.vy;
              pt.vx *= 0.986;
              pt.vy *= 0.986;
              pt.life -= 0.012;
              if (pt.life <= 0) {
                particles.splice(pi, 1);
                continue;
              }
              ctx.save();
              ctx.globalAlpha = Math.min(1, pt.life);
              ctx.fillStyle = pt.color;
              ctx.fillRect(Math.round(pt.x), Math.round(pt.y), pt.size, pt.size);
              ctx.restore();
            }
          }

          if (flashAlpha > 0.01) {
            ctx.fillStyle = 'rgba(255, 250, 235, ' + flashAlpha.toFixed(2) + ')';
            ctx.fillRect(-16, -16, 352, 212);
            flashAlpha *= 0.85;
          }

          ctx.restore();
          requestAnimationFrame(frame);
        }

        // Permitir clic para adelantar overlay después de la detonación
        window.addEventListener('pointerdown', function () {
          var elapsed = (performance.now() - t0) / 1000;
          if (exploded && !overlayShown && elapsed > 3.6) {
            overlayShown = true;
            if (endOverlay) endOverlay.classList.add('visible');
          }
        });

        var btnRetry = document.getElementById('btn-retry');
        if (btnRetry) {
          btnRetry.addEventListener('click', function () {
            try {
              window.parent.postMessage({ type: 'GAME_OVER_RETRY' }, '*');
            } catch (e) {}
          });
        }
        var btnMenu = document.getElementById('btn-menu');
        if (btnMenu) {
          btnMenu.addEventListener('click', function () {
            try {
              window.parent.postMessage({ type: 'GAME_OVER_MENU' }, '*');
            } catch (e) {}
          });
        }

        requestAnimationFrame(frame);
      })();
    </script>
  </body>
</html>
